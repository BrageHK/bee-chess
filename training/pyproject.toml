[project]
name = "bee-training"
version = "0.1.0"
description = "Bee Chess training and dataset generation"
requires-python = ">=3.14"
dependencies = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "chess>=1.11.0",
    "httpx>=0.28.0",
    "tqdm>=4.66.0",
    "mambapy>=1.2.0",
    "triton-rocm>=3.8.0,<3.9 ; sys_platform == 'linux'",
    "matplotlib>=3.9.0",
    "numpy>=1.26.0",
    "mamba-mcts-native",
]

[project.scripts]
bee-training = "bee_training.cli:main"
# UCI engine entry point -- point any UCI harness (a GUI, cutechess-cli,
# lichess-bot's `homemade`/`uci` engine config) at this. See
# ../mamba_mcts_native/README.md for the underlying search and
# bee_training/chess_mamba/play_mcts.py for the engine itself.
bee-mamba-mcts-uci = "bee_training.chess_mamba.play_mcts:main"

[dependency-groups]
dev = [
    "onnx>=1.22.0",
    "onnxruntime>=1.29.0",
    "onnxscript>=0.7.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv.sources]
# ROCm wheels only exist for Linux; on other platforms (e.g. macOS, where
# torch uses CPU/MPS) fall back to the default PyPI wheels.
torch = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
triton-rocm = [{ index = "pytorch-rocm" }]
# See ../mamba_mcts_native/README.md -- PyO3 doesn't officially support
# Python 3.14 yet, so building this on a 3.14 interpreter (this project's
# own requires-python) needs PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 set
# before `uv sync`.
mamba-mcts-native = { path = "../mamba_mcts_native", editable = true }

[project]
name = "bee-training"
version = "0.1.0"
description = "Bee Chess training and dataset generation"
requires-python = ">=3.14"
dependencies = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "chess>=1.11.0",
    "httpx>=0.28.0",
    "tqdm>=4.66.0",
]

[project.scripts]
bee-training = "bee_training.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

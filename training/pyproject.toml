[project]
name = "bee-training"
version = "0.1.0"
description = "Bee Chess training and dataset generation"
requires-python = ">=3.14"
dependencies = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "mambapy>=1.2.0",
    "triton-rocm>=3.8.0,<3.9 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-rocm" }]
torchvision = [{ index = "pytorch-rocm" }]
triton-rocm = [{ index = "pytorch-rocm" }]

name: CI / Chess

on:
  push:
    branches: [main]
    paths:
      - 'chess/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci-chess.yml'
  pull_request:
    paths:
      - 'chess/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci-chess.yml'

concurrency:
  group: ci-chess-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chess:
    name: Chess
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chess
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # chess/ is a member of the root Cargo workspace (see /Cargo.toml).
          workspaces: .
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

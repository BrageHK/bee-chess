[project]
name = "bee-bridge"
version = "0.1.0"
description = "Development WebSocket <-> UCI bridge (frontend to engine processes)"
requires-python = ">=3.13"
dependencies = [
    "websockets>=13.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

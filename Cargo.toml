[workspace]
resolver = "2"
members = ["chess", "engine", "lab", "book-format", "game-catalog", "tools/bee-games"]

# `bee` (in engine/) stays the competition binary with zero web/orchestration
# dependencies -- see #67's architecture issue. `lab` is a separate crate for
# exactly that reason: it can depend on tokio/axum/etc. without any of that
# ever reaching the engine binary itself, since Cargo workspace members don't
# share dependencies unless they actually depend on each other.
#
# `chess` (bee-chess-core) holds the canonical Position/Move/legality/FEN/
# Zobrist types, extracted out of engine/ so lab/ can share one authoritative
# interpretation of chess rules with the competition engine instead of
# validating moves against a second implementation -- see #69's design notes.
#
# `game-catalog` (bee-game-catalog) is a persistent SQLite-backed store of
# imported games (Lichess, for now), consumed by the `bee-games` CLI in
# tools/. Kept as its own crate for the same reason as `lab`: it pulls in
# reqwest/rusqlite/an HTTP Lichess client, none of which the competition
# engine binary should ever depend on. It is offline data tooling, not part
# of the engine's search hot path.
#
# `book-format` (bee-book-format) is the .book binary artifact format and
# position-key scheme, split out from game-catalog specifically so engine/
# can read a book (via its ExperienceBook OpeningBook impl) without gaining
# game-catalog's HTTP/SQLite dependencies -- it depends on nothing but
# `chess`. game-catalog's offline builder and engine's runtime reader are
# the format's only two consumers, sharing this one contract between them.
